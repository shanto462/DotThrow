name: Feature request
description: Suggest a new check, a validator feature, or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
      placeholder: For example, "I need to reject strings that are not valid IP addresses, and today I write a custom If() for it."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed API
      description: How would you like it to work? A short code sample helps. It is formatted as C# automatically.
      placeholder: |
        address.Throw().IfNotIpAddress();
      render: csharp
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      placeholder: For example, "address.Throw().If(a => !IPAddress.TryParse(a, out _), "Not an IP address."), but I repeat it in many places."
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, related issues, or examples from other libraries.
