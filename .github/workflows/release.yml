name: Release

# A pushed tag like v2.0.0 tests, packs, attests and publishes every package
# (DotThrow and its companion packages, one shared version) to NuGet.org with
# trusted publishing (no long-lived API key), and creates a GitHub Release. A
# manual run (workflow_dispatch), or a pull request that changes this workflow
# or the build inputs, is a dry run: it tests and packs but does not attest or
# publish anything.

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Directory.Build.props
      - Directory.Packages.props
      - src/*/*.csproj
      - eng/pack.sh
      - global.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # Full history (all branches and tags), so the tagged commit can be compared with main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only a commit that is already on main may be released. A tag ruleset limits who can
      # create v* tags; this check stops a tag on any other commit, for example on a branch.
      - name: Check that the tagged commit is on main
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git rev-parse --verify --quiet origin/main > /dev/null || {
            echo "::error::origin/main was not fetched"
            exit 1
          }
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $REF_NAME points to $(git rev-parse --short HEAD), which is not on main. Tag a commit of main."
            exit 1
          fi
          echo "Tag $REF_NAME points to $(git rev-parse --short HEAD), which is on main."
      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Read version and verify tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(dotnet msbuild src/DotThrow/DotThrow.csproj -getProperty:Version | tail -n 1 | tr -d '[:space:]')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error file=Directory.Build.props::Could not read a valid version (VersionPrefix and VersionSuffix in Directory.Build.props)"
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match the project version v$version"
            exit 1
          fi
          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac
          echo "Version: $version (prerelease: $prerelease)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Extract release notes from CHANGELOG.md
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -f CHANGELOG.md ]; then
            # Print the body of the "## [x.y.z]" section, stop at the next
            # "## [" heading, and drop link reference lines like "[x.y.z]: url".
            awk -v ver="$VERSION" '
              /^## \[/ {
                if (found) exit
                if (index($0, "## [" ver "]") == 1) { found = 1; next }
              }
              found && /^\[[^ ]*\]: / { next }
              found && !started && /^[ \t]*$/ { next }
              found { started = 1; print }
            ' CHANGELOG.md > release-notes.md
          else
            : > release-notes.md
          fi
          if ! grep -q '[^[:space:]]' release-notes.md; then
            if [ "$EVENT_NAME" = "push" ]; then
              echo "::error file=CHANGELOG.md::No '## [$VERSION]' section with content found in CHANGELOG.md"
              exit 1
            fi
            echo "::warning file=CHANGELOG.md::No '## [$VERSION]' section found in CHANGELOG.md (dry run)"
            echo "Dry run: no changelog section found for $VERSION." > release-notes.md
          fi
          {
            echo "## Release notes for $VERSION"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: Test and pack
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No NuGet cache here: a release is always built from a clean restore.
      - name: Install .NET (SDK from global.json, plus the .NET 8 and 9 runtimes)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Run tests (Release)
        run: |
          failed=0
          for project in tests/*/*.csproj; do
            echo "::group::$project"
            dotnet test "$project" -c Release || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
      # Packs every packable project under src/ (DotThrow, DotThrow.DependencyInjection,
      # DotThrow.AspNetCore, ...) with package validation, and checks that each package has
      # this version, its target framework folders and symbols, and that the core package
      # has no dependencies. See eng/pack.sh.
      - name: Pack and check packages
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash eng/pack.sh dist -p:ContinuousIntegrationBuild=true
      - name: Generate SHA256SUMS
        working-directory: dist
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          sha256sum -- *.nupkg *.snupkg > SHA256SUMS
          {
            echo '## SHA256SUMS'
            echo
            echo '```text'
            cat SHA256SUMS
            echo '```'
            if [ "$EVENT_NAME" != "push" ]; then
              echo
              echo "Dry run: nothing is attested or published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest
    # Only v* tags may deploy to this environment (repository setting).
    environment: release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # mint the OIDC token for the Sigstore certificate
      attestations: write # store the build provenance attestation
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Generate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  publish-nuget:
    name: Publish to NuGet
    # Only v* tags may deploy to this environment (repository setting).
    # The NuGet.org trusted publishing policy trusts release.yml in this environment.
    environment: release
    if: github.event_name == 'push'
    needs: [prepare, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # exchange the OIDC token for a short-lived NuGet API key
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Log in to NuGet.org (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: shalahuddinshanto
      # Pushing a .nupkg also pushes the .snupkg with the same name next to it, because
      # nuget.org has a symbol endpoint (NuGet client: PackageUpdateResource). There is no
      # --no-symbols here, so the symbols always go along.
      # The core package goes first, because the other packages depend on it.
      # --skip-duplicate makes a rerun of this job safe.
      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          core="dist/DotThrow.$VERSION.nupkg"
          packages=("$core")
          for package in dist/*.nupkg; do
            if [ "$package" != "$core" ]; then
              packages+=("$package")
            fi
          done
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
          {
            echo '## NuGet.org'
            echo
            for package in "${packages[@]}"; do
              id="$(basename "$package" ".$VERSION.nupkg")"
              echo "- Pushed [$id $VERSION](https://www.nuget.org/packages/$id/$VERSION) and its symbols."
            done
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Publish GitHub Release
    # Only v* tags may deploy to this environment (repository setting).
    environment: release
    if: github.event_name == 'push'
    needs: [prepare, publish-nuget]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file notes/release-notes.md \
            --verify-tag \
            "${flags[@]}" \
            dist/*
